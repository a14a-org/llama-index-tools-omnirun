name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14.5"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # The omnirun SDK is not published to PyPI; install the package and
          # its dev tooling without resolving runtime deps, then add the
          # importable runtime deps explicitly. Tests stub omnirun (see
          # tests/conftest.py) and mock the Sandbox class.
          pip install --no-deps -e ".[dev]"
          pip install "llama-index-core>=0.11" "ruff>=0.6" "mypy>=1.11" "pytest>=8"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy llama_index_tools_omnirun

      - name: Test (pytest)
        run: pytest -q
