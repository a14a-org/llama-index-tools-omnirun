[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llama-index-tools-omnirun"
version = "0.1.0"
description = "LlamaIndex tools for OmniRun sandboxes — execute code in isolated Firecracker microVMs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "llama-index-core>=0.11",
    "omnirun>=0.5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
