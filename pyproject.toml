[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llama-index-tools-omnirun"
version = "0.1.0"
description = "LlamaIndex tools for OmniRun sandboxes — execute code in isolated Firecracker microVMs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "llama-index-core>=0.14.24",
    "omnirun>=0.6.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
    "mypy>=2.3.1",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
follow_imports = "skip"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
